
<svg xmlns="http://www.w3.org/2000/svg"
     width="64"
     height="64"
     viewBox="0 0 64 64">

    <!-- Rounded background: -->
    <rect
        width="64"
        height="64"
        rx="15"
        fill="#142b49"
    />

    <!-- Compass outer circle: -->
    <circle
        cx="32"
        cy="32"
        r="22"
        fill="none"
        stroke="#ffffff"
        stroke-width="2.5"
    />

    <!-- Compass needle pointing north: -->
    <path
        d="M39 25 L27 27 L25 39 L37 37 Z"
        fill="#087f8c"
        stroke="#ffffff"
        stroke-width="1.5"
        stroke-linejoin="round"
    />

    <!-- Compass center: -->
    <circle
        cx="32"
        cy="32"
        r="3"
        fill="#ffffff"
    />

    <!-- North direction marker: -->
    <circle
        cx="32"
        cy="15"
        r="2"
        fill="#087f8c"
    />

</svg>
